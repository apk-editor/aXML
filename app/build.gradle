plugins {
    id 'com.android.application'
}

android {
    signingConfigs {
        release {
            def keystoreFile = file("signing_cert.p12")
            if (keystoreFile.exists() && System.getenv("KEYSTORE_PASSWORD") != null) {
                storeFile keystoreFile
                storeType "PKCS12"
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    compileSdk 37
    namespace 'com.apk.axmleditor'

    defaultConfig {
        applicationId "com.apk.axmleditor"
        minSdkVersion 23
        targetSdk 37
        versionCode 3
        versionName "v0.3"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (file("signing_cert.p12").exists() && System.getenv("KEYSTORE_PASSWORD") != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        buildConfig = true
    }
}

dependencies {
    implementation (project(':library'))
    implementation libs.apksig
    implementation libs.material
}